<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0f1a"/>
  <g transform="translate(12, 8)">
    <!-- Bus body -->
    <rect x="2" y="10" width="36" height="28" rx="4" fill="#2563eb"/>
    <!-- Windshield -->
    <rect x="5" y="13" width="30" height="12" rx="2" fill="#1e3a5f"/>
    <!-- Windows -->
    <rect x="7" y="15" width="8" height="8" rx="1.5" fill="#93c5fd" opacity="0.8"/>
    <rect x="18" y="15" width="8" height="8" rx="1.5" fill="#93c5fd" opacity="0.8"/>
    <rect x="29" y="15" width="4" height="8" rx="1.5" fill="#93c5fd" opacity="0.6"/>
    <!-- Headlights -->
    <rect x="4" y="30" width="5" height="3" rx="1" fill="#fbbf24"/>
    <rect x="31" y="30" width="5" height="3" rx="1" fill="#fbbf24"/>
    <!-- Wheels -->
    <circle cx="12" cy="40" r="4" fill="#1e293b"/>
    <circle cx="12" cy="40" r="2" fill="#475569"/>
    <circle cx="28" cy="40" r="4" fill="#1e293b"/>
    <circle cx="28" cy="40" r="2" fill="#475569"/>
    <!-- Door -->
    <rect x="16" y="26" width="5" height="10" rx="1" fill="#1e3a5f"/>
    <line x1="18.5" y1="27" x2="18.5" y2="35" stroke="#2563eb" stroke-width="0.5"/>
  </g>
</svg>
